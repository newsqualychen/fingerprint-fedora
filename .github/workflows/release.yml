name: Build Release

on:
  push:
    tags:
      - 'v*-fedora*'
  workflow_dispatch:
    inputs:
      fedora_version:
        description: 'Fedora version to build for'
        required: true
        default: '45'
        type: choice
        options: ['45']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Fedora version and tag
        id: meta
        shell: bash
        run: |
          # Tag format: v1.0.0-fedora45  ->  FEDORA_VERSION=45
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "fedora_version=${{ inputs.fedora_version }}" >> "$GITHUB_OUTPUT"
            echo "tag=manual-fedora${{ inputs.fedora_version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF_NAME}"
            VER=$(echo "$TAG" | sed -nE 's/.*-fedora([0-9]+).*/\1/p')
            if [ -z "$VER" ]; then
              echo "::error::Invalid tag format, expected v1.0.0-fedora45"
              exit 1
            fi
            echo "fedora_version=$VER" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      # Compile AND assemble inside the Fedora container so the produced files
      # never need to cross a Docker volume boundary as root-owned artifacts.
      - name: Build and package in Fedora container
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -e TAG="${{ steps.meta.outputs.tag }}" \
            -e VER="${{ steps.meta.outputs.fedora_version }}" \
            fedora:${{ steps.meta.outputs.fedora_version }} \
            bash -s <<'CONTAINER_SCRIPT'
          set -euo pipefail
          dnf -y install \
            gcc gcc-c++ meson ninja-build make python3 \
            glib2-devel libgusb-devel libgudev-devel \
            openssl-devel pixman-devel systemd-devel \
            git tar gzip

          git clone https://gitlab.freedesktop.org/libfprint/libfprint.git /tmp/libfprint
          cd /tmp/libfprint
          git fetch origin refs/merge-requests/626/head
          git checkout FETCH_HEAD
          COMMIT=$(git rev-parse HEAD)

          meson setup build --prefix=/usr/local --libdir=lib64 --buildtype=release \
            -Dintrospection=false -Ddoc=false -Dgtk-examples=false \
            -Dinstalled-tests=false -Dudev_rules=disabled -Dudev_hwdb=disabled
          meson compile -C build
          test -f build/libfprint/libfprint-2.so.2.0.0

          PKG="fingerprint-validity-${TAG}"
          STAGE="/tmp/stage/${PKG}"
          mkdir -p "$STAGE/lib" "$STAGE/data"
          cp build/libfprint/libfprint-2.so.2.0.0 "$STAGE/lib/"
          cp -a /workspace/data/validity "$STAGE/data/"
          cp -r /workspace/scripts "$STAGE/"
          cp /workspace/README.md /workspace/LICENSE "$STAGE/"
          {
            echo "fingerprint-validity - ${TAG}"
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Target: Fedora ${VER}"
            echo "libfprint source: https://gitlab.freedesktop.org/libfprint/libfprint/-/merge_requests/626"
            echo "libfprint commit: ${COMMIT}"
            echo "Data source: https://gitlab.freedesktop.org/ggiesen/libfprint-validity-data"
          } > "$STAGE/BUILD_INFO.txt"
          chmod +x "$STAGE"/scripts/*.sh

          tar -czf "/workspace/dist/${PKG}.tar.gz" -C /tmp/stage "$PKG"
          ls -lh "/workspace/dist/${PKG}.tar.gz"
          CONTAINER_SCRIPT

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          ls -lh "$GITHUB_WORKSPACE"/dist/*.tar.gz
          tar -tzf "$GITHUB_WORKSPACE"/dist/*.tar.gz | head -20

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          body: |
            ## HP Elite x2 G4 指纹解锁 — Fedora ${{ steps.meta.outputs.fedora_version }}

            支持传感器 `06cb:00b7 Synaptics/Validity Fingerprint reader [HP G6]`。

            ### 下载使用
            下载 `fingerprint-validity-${{ steps.meta.outputs.tag }}.tar.gz`，解压后：

            ```bash
            tar -xzf fingerprint-validity-${{ steps.meta.outputs.tag }}.tar.gz
            cd fingerprint-validity-${{ steps.meta.outputs.tag }}
            sudo bash scripts/01-install.sh
            fprintd-enroll -f right-index-finger $USER
            sudo bash scripts/02-enable-gdm-login.sh   # 启用 GDM 登录指纹
            ```

            详细步骤见包内 README.md。

            ---

            ## Fingerprint unlock for HP Elite x2 G4 — Fedora ${{ steps.meta.outputs.fedora_version }}

            Supports the `06cb:00b7 Synaptics/Validity` fingerprint sensor.

            ### Download & install
            Download `fingerprint-validity-${{ steps.meta.outputs.tag }}.tar.gz` and run:

            ```bash
            tar -xzf fingerprint-validity-${{ steps.meta.outputs.tag }}.tar.gz
            cd fingerprint-validity-${{ steps.meta.outputs.tag }}
            sudo bash scripts/01-install.sh
            fprintd-enroll -f right-index-finger $USER
            sudo bash scripts/02-enable-gdm-login.sh   # enable GDM fingerprint login
            ```

            See README.md inside the package for full instructions (中文 / English).

            ### Contents / 内容
            - Custom libfprint library (MR !626, commit in BUILD_INFO.txt)
            - Validity sensor data files
            - Install / uninstall / rollback scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep artifact for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-validity-${{ steps.meta.outputs.tag }}
          path: dist/*.tar.gz
