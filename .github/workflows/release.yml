name: Build Release

on:
  push:
    tags:
      - 'v*-fedora*'
  workflow_dispatch:
    inputs:
      fedora_version:
        description: 'Fedora version to build for'
        required: true
        default: '45'
        type: choice
        options: ['45']

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      fedora_version: ${{ steps.resolve.outputs.fedora_version }}
      tag: ${{ steps.resolve.outputs.tag }}
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Resolve Fedora version and tag
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.fedora_version }}"
            TAG="manual-fedora${VER}"
          else
            TAG="${GITHUB_REF_NAME}"
            VER=$(echo "$TAG" | sed -nE 's/.*-fedora([0-9]+).*/\1/p')
            if [ -z "$VER" ]; then
              echo "::error::Invalid tag format, expected v1.0.0-fedora45"
              exit 1
            fi
          fi
          echo "fedora_version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=fedora:$VER" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.meta.outputs.image }}
    steps:
      # Fedora base image has no git; install it before checkout.
      - name: Install git for checkout
        run: dnf -y install git

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf -y install \
            gcc gcc-c++ meson ninja-build make python3 \
            glib2-devel libgusb-devel libgudev-devel \
            openssl-devel pixman-devel systemd-devel \
            tar gzip

      - name: Build libfprint MR !626
        run: |
          set -euo pipefail
          git clone https://gitlab.freedesktop.org/libfprint/libfprint.git /tmp/libfprint
          cd /tmp/libfprint
          git fetch origin refs/merge-requests/626/head
          git checkout FETCH_HEAD
          git rev-parse HEAD > /tmp/libfprint-commit.txt
          meson setup build --prefix=/usr/local --libdir=lib64 --buildtype=release \
            -Dintrospection=false -Ddoc=false -Dgtk-examples=false \
            -Dinstalled-tests=false -Dudev_rules=disabled -Dudev_hwdb=disabled
          meson compile -C build
          test -f build/libfprint/libfprint-2.so.2.0.0

      - name: Assemble release package
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          VER="${{ needs.meta.outputs.fedora_version }}"
          PKG="fingerprint-validity-${TAG}"
          mkdir -p "$PKG/lib" "$PKG/data"
          cp /tmp/libfprint/build/libfprint/libfprint-2.so.2.0.0 "$PKG/lib/"
          cp -a data/validity "$PKG/data/"
          cp -r scripts "$PKG/"
          cp README.md LICENSE "$PKG/"
          {
            echo "fingerprint-validity - ${TAG}"
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Target: Fedora ${VER}"
            echo "libfprint source: https://gitlab.freedesktop.org/libfprint/libfprint/-/merge_requests/626"
            echo "libfprint commit: $(cat /tmp/libfprint-commit.txt)"
            echo "Data source: https://gitlab.freedesktop.org/ggiesen/libfprint-validity-data"
          } > "$PKG/BUILD_INFO.txt"
          chmod +x "$PKG"/scripts/*.sh
          tar -czf "${PKG}.tar.gz" "$PKG"
          ls -lh "${PKG}.tar.gz"
          # Verify archive integrity without piping to head (would cause SIGPIPE / exit 141 with pipefail)
          tar -tzf "${PKG}.tar.gz" > /dev/null

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: fingerprint-validity-*.tar.gz
          generate_release_notes: true
          body: |
            ## HP Elite x2 G4 指纹解锁 — Fedora ${{ needs.meta.outputs.fedora_version }}

            支持传感器 `06cb:00b7 Synaptics/Validity Fingerprint reader [HP G6]`。

            ### 下载使用
            下载 `fingerprint-validity-${{ needs.meta.outputs.tag }}.tar.gz`，解压后：

            ```bash
            tar -xzf fingerprint-validity-${{ needs.meta.outputs.tag }}.tar.gz
            cd fingerprint-validity-${{ needs.meta.outputs.tag }}
            sudo bash scripts/01-install.sh
            fprintd-enroll -f right-index-finger $USER
            sudo bash scripts/02-enable-gdm-login.sh   # 启用 GDM 登录指纹
            ```

            详细步骤见包内 README.md。

            ---

            ## Fingerprint unlock for HP Elite x2 G4 — Fedora ${{ needs.meta.outputs.fedora_version }}

            Supports the `06cb:00b7 Synaptics/Validity` fingerprint sensor.

            ### Download & install
            Download `fingerprint-validity-${{ needs.meta.outputs.tag }}.tar.gz` and run:

            ```bash
            tar -xzf fingerprint-validity-${{ needs.meta.outputs.tag }}.tar.gz
            cd fingerprint-validity-${{ needs.meta.outputs.tag }}
            sudo bash scripts/01-install.sh
            fprintd-enroll -f right-index-finger $USER
            sudo bash scripts/02-enable-gdm-login.sh   # enable GDM fingerprint login
            ```

            See README.md inside the package for full instructions (中文 / English).

            ### Contents / 内容
            - Custom libfprint library (MR !626, commit in BUILD_INFO.txt)
            - Validity sensor data files
            - Install / uninstall / rollback scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep artifact for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-validity-${{ needs.meta.outputs.tag }}
          path: fingerprint-validity-*.tar.gz
