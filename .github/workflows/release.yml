name: Build Release

on:
  push:
    tags:
      - 'v*-fedora*'
  workflow_dispatch:
    inputs:
      fedora_version:
        description: 'Fedora version to build for'
        required: true
        default: '45'
        type: choice
        options: ['45']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Fedora version and tag
        id: meta
        shell: bash
        run: |
          # Tag 格式: v1.0.0-fedora45  ->  FEDORA_VERSION=45
          # 手动触发时用 workflow_dispatch 的 inputs
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "fedora_version=${{ inputs.fedora_version }}" >> "$GITHUB_OUTPUT"
            echo "tag=manual-fedora${{ inputs.fedora_version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF_NAME}"
            VER=$(echo "$TAG" | sed -nE 's/.*-fedora([0-9]+).*/\1/p')
            if [ -z "$VER" ]; then
              echo "::error::Tag 格式错误，应为 v1.0.0-fedora45 形式"
              exit 1
            fi
            echo "fedora_version=$VER" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in Fedora container
        run: |
          # 用 podman/docker 在 Fedora 容器里编译（runner 自带 docker）
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace:ro \
            -v /tmp/libfprint-build:/build \
            -e FE_VERSION="${{ steps.meta.outputs.fedora_version }}" \
            fedora:${{ steps.meta.outputs.fedora_version }} \
            bash -s <<'CONTAINER_SCRIPT'
          set -euo pipefail
          dnf -y install \
            gcc gcc-c++ meson ninja-build make python3 \
            glib2-devel libgusb-devel libgudev-devel \
            openssl-devel pixman-devel systemd-devel \
            git tar gzip

          git clone https://gitlab.freedesktop.org/libfprint/libfprint.git /tmp/libfprint
          cd /tmp/libfprint
          git fetch origin refs/merge-requests/626/head
          git checkout FETCH_HEAD
          git rev-parse HEAD > /build/libfprint-commit.txt

          meson setup build --prefix=/usr/local --libdir=lib64 --buildtype=release \
            -Dintrospection=false -Ddoc=false -Dgtk-examples=false \
            -Dinstalled-tests=false -Dudev_rules=disabled -Dudev_hwdb=disabled
          meson compile -C build
          test -f build/libfprint/libfprint-2.so.2.0.0
          cp build/libfprint/libfprint-2.so.2.0.0 /build/libfprint-2.so.2.0.0
          ls -lh /build/libfprint-2.so.2.0.0
          CONTAINER_SCRIPT

      - name: Assemble release package
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          VER="${{ steps.meta.outputs.fedora_version }}"
          PKG="fingerprint-validity-${TAG}"
          STAGE="/tmp/stage/$PKG"
          mkdir -p "$STAGE/lib" "$STAGE/data"
          cp /tmp/libfprint-build/libfprint-2.so.2.0.0 "$STAGE/lib/"
          cp -a "$GITHUB_WORKSPACE/data/validity" "$STAGE/data/"
          cp -r "$GITHUB_WORKSPACE/scripts" "$STAGE/"
          cp "$GITHUB_WORKSPACE/README.md" "$GITHUB_WORKSPACE/LICENSE" "$STAGE/"
          {
            echo "fingerprint-validity - ${TAG}"
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Target: Fedora ${VER}"
            echo "libfprint source: https://gitlab.freedesktop.org/libfprint/libfprint/-/merge_requests/626"
            echo "libfprint commit: $(cat /tmp/libfprint-build/libfprint-commit.txt)"
            echo "Data source: https://gitlab.freedesktop.org/ggiesen/libfprint-validity-data"
          } > "$STAGE/BUILD_INFO.txt"
          chmod +x "$STAGE"/scripts/*.sh
          cd /tmp/stage
          tar -czf "${GITHUB_WORKSPACE}/${PKG}.tar.gz" "$PKG"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: fingerprint-validity-*.tar.gz
          generate_release_notes: true
          body: |
            ## HP Elite x2 G4 指纹解锁 — Fedora ${{ steps.meta.outputs.fedora_version }}

            支持传感器 `06cb:00b7 Synaptics/Validity Fingerprint reader [HP G6]`。

            ### 下载使用
            下载 `fingerprint-validity-${{ steps.meta.outputs.tag }}.tar.gz`，解压后：

            ```bash
            tar -xzf fingerprint-validity-${{ steps.meta.outputs.tag }}.tar.gz
            cd fingerprint-validity-${{ steps.meta.outputs.tag }}
            sudo bash scripts/01-install.sh
            fprintd-enroll -f right-index-finger $USER
            sudo bash scripts/02-enable-gdm-login.sh   # 启用 GDM 登录指纹
            ```

            详细步骤见包内 README.md。

            ### 内容
            - 自定义 libfprint 库（MR !626，commit 见 BUILD_INFO.txt）
            - Validity 传感器数据文件
            - 安装/卸载/撤销脚本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep artifact for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-validity-${{ steps.meta.outputs.tag }}
          path: fingerprint-validity-*.tar.gz
